<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köksskärm / Stekbord (KDS) — Ishak's Smash Burger</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--surface:#121212;--surface-2:#1A1A1A;--border:#262626;
  --yellow:#FFC000;--green:#2ECC71;--red:#E74C3C;--blue:#00A3E0;
  --font-d:'Barlow Condensed',sans-serif;--font-b:'Inter',system-ui,sans-serif;
}
body{
  background:var(--bg);color:#fff;font-family:var(--font-b);
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* TOPBAR */
.kds-header{
  height:70px;background:var(--surface);border-bottom:2px solid var(--border);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:100;
}
.kds-brand{display:flex;align-items:center;gap:12px}
.kds-brand img{width:42px;height:42px;object-fit:contain}
.kds-title{font-family:var(--font-d);font-weight:900;font-size:22px;letter-spacing:1px;text-transform:uppercase}
.kds-sub{font-size:12px;color:#8E8E8E;font-weight:600}

.kds-stats{display:flex;align-items:center;gap:20px}
.kds-puck-counter{
  background:#1f1905;border:1px solid #4a3800;border-radius:6px;
  padding:8px 16px;display:flex;align-items:center;gap:10px;
}
.kds-puck-num{font-family:var(--font-d);font-weight:900;font-size:26px;color:var(--yellow);line-height:1}
.kds-puck-label{font-size:12px;font-weight:700;text-transform:uppercase;color:#ddd;line-height:1.2}

.kds-clock{font-family:var(--font-d);font-weight:800;font-size:26px;letter-spacing:1px;color:#fff}
.kds-actions{display:flex;align-items:center;gap:10px}
.kds-btn{
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
  padding:8px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.kds-btn:hover{border-color:var(--yellow);color:var(--yellow)}

/* TICKETS GRID */
.kds-grid{
  flex:1;padding:24px;display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:20px;align-content:start;
}

.ticket{
  background:var(--surface);border:2px solid var(--border);border-radius:8px;
  display:flex;flex-direction:column;overflow:hidden;transition:border-color .2s;
}
.ticket.status-new{border-color:#3a2f05}
.ticket.status-cooking{border-color:var(--yellow)}
.ticket.status-ready{border-color:var(--green)}
.ticket.urgent{border-color:var(--red)}

.ticket-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);
}
.ticket-id{font-family:var(--font-d);font-weight:900;font-size:26px;color:#fff;line-height:1}
.ticket-timer{
  font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:1px;
  padding:3px 8px;border-radius:4px;background:#222;
}
.timer-green{color:var(--green)}
.timer-yellow{color:var(--yellow);background:#332900}
.timer-red{color:#fff;background:var(--red)}

.ticket-meta{
  padding:10px 16px;border-bottom:1px solid var(--border);
  font-size:13px;display:flex;justify-content:space-between;color:#8E8E8E;
}
.ticket-customer{font-weight:700;color:#fff}
.ticket-pay-badge{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;text-transform:uppercase;
}
.pay-swish{background:#0d2330;color:var(--blue)}
.pay-cash{background:#1f1905;color:var(--yellow)}

.ticket-body{flex:1;padding:16px}
.ticket-item{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1c1c1c}
.ticket-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ticket-item-title{
  display:flex;align-items:flex-start;gap:8px;font-family:var(--font-d);
  font-weight:900;font-size:22px;line-height:1.1;text-transform:uppercase;color:#fff;
}
.ticket-item-qty{color:var(--yellow);font-size:24px}
.ticket-item-mods{font-size:13px;color:#bbb;margin-top:4px;padding-left:24px;line-height:1.4}
.ticket-note{
  background:#261805;border-left:3px solid var(--yellow);padding:8px 10px;
  border-radius:3px;font-size:12.5px;color:#ffd866;font-weight:600;margin-top:8px;
}

.ticket-footer{
  padding:12px 16px;border-top:1px solid var(--border);
  background:var(--surface-2);display:flex;gap:10px;
}
.btn-kds-action{
  flex:1;font-family:var(--font-d);font-weight:900;font-size:17px;letter-spacing:.5px;
  text-transform:uppercase;padding:12px 14px;border-radius:4px;text-align:center;
  transition:all .15s;
}
.btn-cook{background:#262205;border:1px solid #4a3e00;color:var(--yellow)}
.btn-cook:hover{background:var(--yellow);color:#000}
.btn-ready{background:var(--green);color:#000}
.btn-ready:hover{background:#27ae60}
.btn-ping{
  background:#0d2b1a;border:1px solid #1a4a2a;color:var(--green);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-ping:hover{background:#164228}

@media(max-width:768px){
  .kds-header{height:auto;padding:12px 16px;flex-wrap:wrap}
  .kds-stats{order:3;width:100%;justify-content:space-between;margin-top:8px}
  .kds-grid{padding:16px;grid-template-columns:1fr}
}
</style>
</head>
<body>

  <header class="kds-header">
    <div class="kds-brand">
      <img src="../assets/images/logo.png" alt="Ishak's Smash Burger" />
      <div>
        <div class="kds-title">Ishak's · Kök &amp; Stekbord</div>
        <div class="kds-sub">Hantverkargatan 5 · Borlänge</div>
      </div>
    </div>

    <div class="kds-stats">
      <div class="kds-puck-counter">
        <div class="kds-puck-num" id="puckCount">8</div>
        <div class="kds-puck-label">Puckar på<br>stekbordet</div>
      </div>
      <div class="kds-clock" id="liveClock">12:30:00</div>
    </div>

    <div class="kds-actions">
      <button class="kds-btn" id="soundBtn" onclick="toggleSound()">
        <span id="soundIcon">🔊</span> Ljud: <strong id="soundStatus">PÅ</strong>
      </button>
      <a href="index.html" class="kds-btn">← Admin</a>
    </div>
  </header>

  <main class="kds-grid" id="kdsGrid"></main>

  <script>
    // Audio Chime via Web Audio API
    let soundEnabled = true;
    function playChime() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundStatus').textContent = soundEnabled ? 'PÅ' : 'AV';
      document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) playChime();
    }

    // Mock Live Kitchen Tickets
    let tickets = [
      {
        id: '#1026',
        customer: 'Marcus K.',
        phone: '0701234567',
        time: '12:28',
        elapsedSec: 140,
        pay: 'Swish',
        status: 'cooking', // new, cooking, ready
        items: [
          { name: 'Smash Burger 1', qty: 2, mods: ['Dubbelkött (+100g)', 'Tryffelmajo'] },
          { name: 'Pommes Frites', qty: 2, mods: [] },
          { name: 'Trocadero 33 cl', qty: 2, mods: [] }
        ],
        note: 'Obs: Extra krispiga pommes!'
      },
      {
        id: '#1025',
        customer: 'Sara Lind',
        phone: '0739876543',
        time: '12:24',
        elapsedSec: 380,
        pay: 'Swish',
        status: 'cooking',
        items: [
          { name: 'Smash Burger 2', qty: 1, mods: ['Glutenfritt briochebröd'] },
          { name: 'Chili Cheese Bites (6 st)', qty: 1, mods: [] }
        ],
        note: 'Glutenallergi — viktigt med rent stekbord!'
      },
      {
        id: '#1024',
        customer: 'Johan Bergström',
        phone: '0705491132',
        time: '12:18',
        elapsedSec: 740,
        pay: 'Swish',
        status: 'ready',
        items: [
          { name: 'Smash Burger 3 (Oklahoma)', qty: 3, mods: ['Srirachamajo', 'Picklad lök'] },
          { name: 'Chicken Nuggets (8 st)', qty: 1, mods: ['Tryffelmajo'] },
          { name: 'Coca-Cola Zero 33 cl', qty: 4, mods: [] }
        ],
        note: ''
      },
      {
        id: '#1023',
        customer: 'Anders E.',
        phone: '0722334455',
        time: '12:12',
        elapsedSec: 1080,
        pay: 'Vid luckan',
        status: 'new',
        items: [
          { name: 'Smash Burger 4 (Classic)', qty: 1, mods: ['Utan senap'] }
        ],
        note: ''
      }
    ];

    function calculatePucks() {
      let count = 0;
      tickets.filter(t => t.status === 'cooking' || t.status === 'new').forEach(t => {
        t.items.forEach(it => {
          if (it.name.includes('Smash')) {
            const isDouble = it.mods?.some(m => m.includes('Dubbel'));
            count += (it.qty * (isDouble ? 3 : 2));
          } else if (it.name.includes('Barn')) {
            count += it.qty * 1;
          }
        });
      });
      document.getElementById('puckCount').textContent = count;
    }

    function renderTickets() {
      const grid = document.getElementById('kdsGrid');
      grid.innerHTML = tickets.map((t, idx) => {
        const minutes = Math.floor(t.elapsedSec / 60);
        const seconds = t.elapsedSec % 60;
        const timeStr = `${minutes}:${seconds < 10 ? '0' : ''}${seconds} min`;
        
        let timerClass = 'timer-green';
        if (minutes >= 12) timerClass = 'timer-red';
        else if (minutes >= 7) timerClass = 'timer-yellow';

        return `
          <div class="ticket status-${t.status} ${minutes >= 14 ? 'urgent' : ''}">
            <div class="ticket-header">
              <span class="ticket-id">${t.id}</span>
              <span class="ticket-timer ${timerClass}">${timeStr}</span>
            </div>

            <div class="ticket-meta">
              <span class="ticket-customer">${t.customer}</span>
              <span class="ticket-pay-badge ${t.pay === 'Swish' ? 'pay-swish' : 'pay-cash'}">${t.pay}</span>
            </div>

            <div class="ticket-body">
              ${t.items.map(it => `
                <div class="ticket-item">
                  <div class="ticket-item-title">
                    <span class="ticket-item-qty">${it.qty}×</span>
                    <span>${it.name}</span>
                  </div>
                  ${it.mods.length ? `<div class="ticket-item-mods">${it.mods.join(' · ')}</div>` : ''}
                </div>
              `).join('')}

              ${t.note ? `<div class="ticket-note">⚠ ${t.note}</div>` : ''}
            </div>

            <div class="ticket-footer">
              ${t.status === 'new' ? `
                <button class="btn-kds-action btn-cook" onclick="setTicketStatus(${idx}, 'cooking')">
                  Börja steka
                </button>
              ` : ''}

              ${t.status === 'cooking' ? `
                <button class="btn-kds-action btn-ready" onclick="setTicketStatus(${idx}, 'ready')">
                  ✓ Klar vid luckan
                </button>
              ` : ''}

              ${t.status === 'ready' ? `
                <button class="btn-kds-action btn-ping" onclick="pingCustomer('${t.id}', '${t.customer}', '${t.phone}')">
                  💬 Pinga kund (WhatsApp)
                </button>
                <button class="kds-btn" style="padding:0 12px;" onclick="archiveTicket(${idx})" title="Arkivera order">
                  Utlämnad
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      calculatePucks();
    }

    function setTicketStatus(idx, status) {
      tickets[idx].status = status;
      playChime();
      renderTickets();
    }

    function archiveTicket(idx) {
      tickets.splice(idx, 1);
      renderTickets();
    }

    function pingCustomer(orderId, name, phone) {
      const msg = `Hej ${name}! Din beställning ${orderId} hos Ishak's Smash Burger är rykande färsk och klar att hämtas vid luckan på Hantverkargatan 5. Smaklig måltid! 🍔`;
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const waNumber = cleanPhone.startsWith('0') ? ('46' + cleanPhone.substring(1)) : cleanPhone;
      window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Timer Tick
    setInterval(() => {
      tickets.forEach(t => t.elapsedSec++);
      renderTickets();
    }, 1000);

    // Live Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('sv-SE');
    }, 1000);

    document.addEventListener('DOMContentLoaded', () => {
      renderTickets();
    });
  </script>
</body>
</html>

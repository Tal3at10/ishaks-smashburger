<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köksskärm / Stekbord (KDS) — Ishak's Smash Burger</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E0E0E;--surface:#151515;--surface-2:#1C1C1C;--border:#262626;
  --yellow:#FFC000;--accent:#FFC000;
  --text:#F2F2F2;--text-muted:#888888;--text-dim:#555555;
  --font-d:'Barlow Condensed',sans-serif;--font-b:'Inter',system-ui,sans-serif;
}
html,body{
  width:100%;max-width:100%;overflow-x:hidden;
}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-b);
  min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* TOPBAR */
.kds-header{
  height:68px;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:100;width:100%;max-width:100%;box-sizing:border-box;
}
.kds-brand{display:flex;align-items:center;gap:12px;min-width:0}
.kds-brand img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.kds-title{font-family:var(--font-d);font-weight:900;font-size:20px;letter-spacing:1px;text-transform:uppercase}
.kds-sub{font-size:11.5px;color:var(--text-muted);font-weight:500}

.kds-stats{display:flex;align-items:center;gap:20px;flex-shrink:0}
.kds-puck-counter{
  background:var(--surface-2);border:1px solid var(--border);border-radius:4px;
  padding:6px 14px;display:flex;align-items:center;gap:10px;
}
.kds-puck-num{font-family:var(--font-d);font-weight:900;font-size:24px;color:var(--yellow);line-height:1}
.kds-puck-label{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-muted);line-height:1.2}

.kds-clock{font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:1px;color:var(--text-muted)}
.kds-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.kds-btn{
  background:var(--surface-2);border:1px solid var(--border);border-radius:4px;
  padding:8px 14px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:7px;transition:all .15s;color:#ccc !important;
  white-space:nowrap;
}
.kds-btn:hover{border-color:#444;color:#fff !important;background:#242424}

.title-short, .btn-text-short, .label-short{display:none}

/* TICKETS GRID */
.kds-grid{
  width:100%;max-width:100%;box-sizing:border-box;
  flex:1;padding:24px;display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:18px;align-content:start;
}

.ticket{
  width:100%;min-width:0;box-sizing:border-box;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.ticket::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#333;
}
.ticket.status-new::before{background:#666}
.ticket.status-cooking::before{background:var(--yellow)}
.ticket.status-ready::before{background:#3e734c}
.ticket.urgent::before{background:#b84233}

.ticket-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);
}
.ticket-id{font-family:var(--font-d);font-weight:900;font-size:24px;color:#fff;line-height:1}
.ticket-timer{
  font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:.5px;
  padding:3px 8px;border-radius:3px;background:#222;color:var(--text-muted);
}
.timer-warn{color:var(--yellow);background:#241d06}
.timer-urgent{color:#f5b0a6;background:#381512}

.ticket-meta{
  padding:8px 16px;border-bottom:1px solid var(--border);
  font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);
}
.ticket-customer{font-weight:600;color:#ddd}
.ticket-pay-badge{
  font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:3px;text-transform:uppercase;
  background:#202020;color:#aaa;border:1px solid #2e2e2e;white-space:nowrap;
}
.ticket-pay-badge.pay-unverified{background:#241d06;color:var(--yellow);border-color:#594600}
.ticket-pay-badge.pay-verified{background:#142117;color:#8cc999;border-color:#26452e}
.ticket-pay-badge.pay-pickup{background:#1d1d1d;color:#ddd;border-color:#3a3a3a}

.ticket-body{flex:1;padding:14px 16px}
.ticket-item{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #1a1a1a}
.ticket-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ticket-item-title{
  display:flex;align-items:flex-start;gap:8px;font-family:var(--font-d);
  font-weight:800;font-size:20px;line-height:1.15;text-transform:uppercase;color:#fff;
}
.ticket-item-qty{color:var(--yellow);font-size:20px;flex-shrink:0}
.ticket-item-mods{font-size:12.5px;color:#999;margin-top:4px;padding-left:22px;line-height:1.4}
.ticket-note{
  background:#1f1908;border-left:2px solid var(--yellow);padding:6px 10px;
  border-radius:2px;font-size:12px;color:#dec578;margin-top:10px;
}

.ticket-footer{
  padding:10px 14px;border-top:1px solid var(--border);
  background:var(--surface-2);display:flex;gap:8px;
}
.btn-kds-action{
  flex:1;font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:.5px;
  text-transform:uppercase;padding:10px 12px;border-radius:4px;text-align:center;
  transition:all .15s;
}
.btn-cook{
  background:#1f1908;border:1px solid #4a3a00;color:var(--yellow);
}
.btn-cook:hover{background:#2a220a;border-color:#6e5600}

.btn-ready{
  background:#262626;border:1px solid #3d3d3d;color:#fff;
}
.btn-ready:hover{background:#303030;border-color:#555}

.btn-ping{
  background:#1e1e1e;border:1px solid #383838;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;
}
.btn-ping:hover{background:#282828;border-color:#555}

.btn-archive{
  background:transparent;border:1px solid #333;color:#888;
  font-size:12px;padding:0 12px;border-radius:4px;font-weight:600;
  text-transform:uppercase;transition:all .15s;
}
.btn-archive:hover{color:#fff;border-color:#555}

@media(max-width:900px) and (min-width:601px){
  .kds-grid{
    grid-template-columns:repeat(2, 1fr);
    padding:14px;
    gap:12px;
  }
}

@media(max-width:768px){
  .title-full, .btn-text-full, .label-full{display:none}
  .title-short, .btn-text-short, .label-short{display:inline}
  .kds-header{height:52px;padding:0 10px;gap:6px;flex-wrap:nowrap}
  .kds-brand{gap:8px}
  .kds-brand img{width:26px;height:26px}
  .kds-title{font-size:14px;white-space:nowrap}
  .kds-sub{display:none}
  .kds-clock{display:none}
  .kds-stats{gap:6px}
  .kds-puck-counter{padding:3px 7px;gap:5px}
  .kds-puck-num{font-size:16px}
  .kds-puck-label{font-size:9px}
  .kds-actions{gap:5px}
  .kds-btn{padding:6px 7px;font-size:11px;gap:4px}
  .ticket-footer{flex-direction:column;gap:8px}
  .btn-kds-action, .btn-archive{width:100%;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .btn-archive{text-align:center;padding:10px}
}
@media(max-width:400px){
  .kds-brand img{display:none}
  .kds-header{padding:0 8px}
}

@media(max-width:600px){
  .kds-grid{
    grid-template-columns:1fr;
    padding:10px;
    gap:12px;
  }
}
</style>
</head>
<body>

  <header class="kds-header">
    <div class="kds-brand">
      <img src="../assets/images/logo.png" alt="Ishak's Smash Burger" />
      <div>
        <div class="kds-title">
          <span class="title-full">Ishak's · Kök &amp; Stekbord</span>
          <span class="title-short">Ishak's KDS</span>
        </div>
        <div class="kds-sub">Hantverkargatan 5 · Borlänge</div>
      </div>
    </div>

    <div class="kds-stats">
      <div class="kds-puck-counter">
        <div class="kds-puck-num" id="puckCount">0</div>
        <div class="kds-puck-label">
          <span class="label-full">Puckar på<br>stekbordet</span>
          <span class="label-short">Puckar</span>
        </div>
      </div>
      <div class="kds-clock" id="liveClock">--:--:--</div>
    </div>

    <div class="kds-actions">
      <button class="kds-btn" id="soundBtn" onclick="toggleSound()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span class="btn-text-full">Ljud: </span><strong id="soundStatus" style="color:#fff;">PÅ</strong>
      </button>
      <a href="../menu.html" class="kds-btn">
        <span class="btn-text-full">Beställningssida</span><span class="btn-text-short">Meny</span>
      </a>
      <a href="index.html" class="kds-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="btn-text-full">Kontrollpanel</span><span class="btn-text-short">Admin</span>
      </a>
    </div>
  </header>

  <main class="kds-grid" id="kdsGrid"></main>

  <script src="../store.js"></script>
  <script>
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let soundEnabled = true;
    function playChime() {
      if (!soundEnabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundStatus').textContent = soundEnabled ? 'PÅ' : 'AV';
      if (soundEnabled) playChime();
    }

    let tickets = [];
    const elapsedMap = {};

    function loadTicketsFromStore() {
      const all = IshakStore.getOrders();
      tickets = all
        .filter(o => o.status === 'new' || o.status === 'cooking' || o.status === 'ready')
        .map(o => ({
          id: o.id,
          customer: o.customer || 'Kund',
          phone: o.phone || '',
          time: o.tid || '',
          pickupTime: o.pickupTime || '',
          total: Number(o.total) || 0,
          paymentStatus: o.paymentStatus || 'verified',
          elapsedSec: elapsedMap[o.id] != null ? elapsedMap[o.id] : (o.elapsedSec || 0),
          pay: (o.kanal || '').toLowerCase().includes('swish') ? 'Swish' : (o.kanal || 'Vid luckan'),
          status: o.status,
          items: o.items || [],
          note: o.note || ''
        }));
    }

    function renderPayBadge(t) {
      if (t.pay === 'Swish') {
        if (t.status === 'new' || t.paymentStatus === 'unverified') {
          return `<span class="ticket-pay-badge pay-unverified">Swish · ${t.total} kr (Stäm av)</span>`;
        }
        return `<span class="ticket-pay-badge pay-verified">Swish · ${t.total} kr ✓</span>`;
      }
      if (t.pay === 'Foodora') {
        return `<span class="ticket-pay-badge">Foodora · ${t.total} kr</span>`;
      }
      return `<span class="ticket-pay-badge pay-pickup">Vid luckan · ${t.total} kr</span>`;
    }

    function calculatePucks() {
      let count = 0;
      tickets.filter(t => t.status === 'cooking' || t.status === 'new').forEach(t => {
        t.items.forEach(it => {
          if (it.name.includes('Smash')) {
            const isDouble = it.mods?.some(m => m.includes('Extra kött') || m.includes('Extra kyckling') || m.includes('Extra halloumi') || m.includes('Dubbel'));
            count += (it.qty * (isDouble ? 3 : 2));
          } else if (it.name.includes('Barn')) {
            count += it.qty * 1;
          }
        });
      });
      document.getElementById('puckCount').textContent = count;
    }

    function renderTickets() {
      loadTicketsFromStore();
      const grid = document.getElementById('kdsGrid');

      if (!tickets.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px 20px;color:#777;font-size:15px;">Inga aktiva ordrar på stekbordet just nu.</div>';
        calculatePucks();
        return;
      }

      grid.innerHTML = tickets.map((t, idx) => {
        const minutes = Math.floor(t.elapsedSec / 60);
        const seconds = t.elapsedSec % 60;
        const timeStr = `${minutes}:${seconds < 10 ? '0' : ''}${seconds} min`;

        let timerClass = '';
        if (minutes >= 12) timerClass = 'timer-urgent';
        else if (minutes >= 6) timerClass = 'timer-warn';

        return `
          <div class="ticket status-${escapeHtml(t.status)} ${minutes >= 14 ? 'urgent' : ''}" data-ticket-card="${idx}">
            <div class="ticket-header">
              <div style="display:flex;align-items:baseline;gap:10px;">
                <span class="ticket-id">${escapeHtml(t.id)}</span>
                <a href="../tack.html?order=${encodeURIComponent(String(t.id).replace(/^#/, ''))}" target="_blank" style="font-size:11px;color:#888;font-weight:600;" title="Öppna kundens livespårning">Kundvy ↗</a>
              </div>
              <span class="ticket-timer ${timerClass}" data-ticket-timer="${idx}">${timeStr}</span>
            </div>

            <div class="ticket-meta" style="gap:8px;flex-wrap:wrap;">
              <span class="ticket-customer">${escapeHtml(t.customer)}${t.phone ? ' · <span style="color:#888;font-weight:400">' + escapeHtml(t.phone) + '</span>' : ''}${t.pickupTime && !t.pickupTime.startsWith('Snarast') ? ' · <span style="color:var(--yellow)">' + escapeHtml(t.pickupTime) + '</span>' : ''}</span>
              ${renderPayBadge(t)}
            </div>

            <div class="ticket-body">
              ${t.items.map(it => `
                <div class="ticket-item">
                  <div class="ticket-item-title">
                    <span class="ticket-item-qty">${Number(it.qty) || 1}×</span>
                    <span>${escapeHtml(it.name)}</span>
                  </div>
                  ${it.mods && it.mods.length ? `<div class="ticket-item-mods">${escapeHtml(it.mods.join(' · '))}</div>` : ''}
                </div>
              `).join('')}

              ${t.note ? `<div class="ticket-note">${escapeHtml(t.note)}</div>` : ''}
            </div>

            <div class="ticket-footer">
              ${t.status === 'new' ? `
                <button class="btn-kds-action btn-cook" onclick="setTicketStatus(${idx}, 'cooking')">
                  Bekräfta &amp; tillaga
                </button>
                <button class="btn-archive" onclick="rejectTicket(${idx})" style="color:#d98278;border-color:#421c17;" title="Avvisa ej betald / felaktig order">
                  Avvisa
                </button>
              ` : ''}

              ${t.status === 'cooking' ? `
                <button class="btn-kds-action btn-ready" onclick="setTicketStatus(${idx}, 'ready')">
                  Klar vid luckan
                </button>
              ` : ''}

              ${t.status === 'ready' ? `
                <button class="btn-kds-action btn-ping" onclick="smsCustomer(${idx})">
                  SMS kund
                </button>
                <button class="btn-kds-action btn-ping" onclick="pingCustomer(${idx})">
                  WhatsApp
                </button>
                <button class="btn-archive" onclick="archiveTicket(${idx})" title="Markera som utlämnad">
                  Utlämnad
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      calculatePucks();
    }

    function setTicketStatus(idx, status) {
      const t = tickets[idx];
      if (!t) return;
      IshakStore.updateOrderStatus(t.id, status);
      playChime();
      renderTickets();
    }

    function archiveTicket(idx) {
      const t = tickets[idx];
      if (!t) return;
      IshakStore.updateOrderStatus(t.id, 'klar');
      renderTickets();
    }

    function rejectTicket(idx) {
      const t = tickets[idx];
      if (!t) return;
      IshakStore.updateOrderStatus(t.id, 'avbruten');
      renderTickets();
    }

    function pingCustomer(idx) {
      const t = tickets[idx];
      if (!t) return;
      const s = IshakStore.getSettings();
      const msg = `Hej ${t.customer}! Din beställning ${t.id} hos ${s.name || "Ishak's Smash Burger"} är nu klar att hämtas vid luckan på ${s.address || 'Hantverkargatan 5'}. Välkommen!`;
      window.open(`https://wa.me/${IshakStore.formatSwedishWhatsApp(t.phone)}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function smsCustomer(idx) {
      const t = tickets[idx];
      if (!t) return;
      const s = IshakStore.getSettings();
      const msg = `Hej ${t.customer}! Din order ${t.id} hos ${s.name || "Ishak's Smash Burger"} är nu klar vid luckan (${s.address || 'Hantverkargatan 5'}). Välkommen!`;
      window.location.href = IshakStore.formatSwedishSMS(t.phone, msg);
    }

    function updateTimers() {
      tickets.forEach((t, idx) => {
        t.elapsedSec++;
        elapsedMap[t.id] = t.elapsedSec;
        const timerEl = document.querySelector(`[data-ticket-timer="${idx}"]`);
        const cardEl = document.querySelector(`[data-ticket-card="${idx}"]`);
        if (!timerEl) return;

        const minutes = Math.floor(t.elapsedSec / 60);
        const seconds = t.elapsedSec % 60;
        timerEl.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds} min`;
        timerEl.className = 'ticket-timer' + (minutes >= 12 ? ' timer-urgent' : minutes >= 6 ? ' timer-warn' : '');
        if (cardEl && minutes >= 14) cardEl.classList.add('urgent');
      });
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toTimeString().split(' ')[0];
    }

    window.addEventListener('storage', (e) => {
      if (e.key === IshakStore.KEYS.ORDERS) {
        const prevCount = tickets.length;
        renderTickets();
        if (tickets.length > prevCount) playChime();
      }
    });
    window.addEventListener('focus', renderTickets);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) renderTickets();
    });

    setInterval(updateTimers, 1000);
    setInterval(updateClock, 1000);
    updateClock();
    renderTickets();
  </script>
</body>
</html>
